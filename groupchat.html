<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
    }

    header {
      height: 60px;
      min-height: 60px;
      border-bottom: 1px solid #181818;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }

    .title {
      font-size: 15px;
      color: #aaa;
    }

    .group-code {
      font-size: 12px;
      color: #555;
      cursor: pointer;
    }

    .group-code:hover {
      color: #888;
    }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 25px 20px;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .message {
      max-width: 700px;
      animation: appear 0.15s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(3px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .nickname {
      font-size: 12px;
      color: #666;
      margin-bottom: 5px;
    }

    .content {
      font-size: 15px;
      line-height: 1.5;
      color: #ddd;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .mine .nickname {
      color: #999;
    }

    .system {
      color: #444;
      text-align: center;
      font-size: 12px;
      margin: 10px 0;
    }

    .composer {
      border-top: 1px solid #181818;
      padding: 14px 16px;
      display: flex;
      gap: 10px;
      background: #000;
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 46px;
      padding: 0 14px;
      border: 1px solid #222;
      border-radius: 7px;
      outline: none;
      background: #050505;
      color: #fff;
      font-size: 15px;
    }

    #messageInput:focus {
      border-color: #444;
    }

    #sendButton {
      width: 80px;
      height: 46px;
      border: 1px solid #fff;
      border-radius: 7px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-size: 14px;
    }

    #sendButton:hover {
      background: #ddd;
    }

    #sendButton:disabled {
      opacity: 0.4;
      cursor: wait;
    }

    .error-screen {
      height: 100%;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 15px;
      color: #777;
      text-align: center;
      padding: 30px;
    }

    .error-screen strong {
      color: #fff;
      font-weight: 400;
    }

    .back {
      color: #777;
      text-decoration: none;
      font-size: 13px;
    }

    .back:hover {
      color: #fff;
    }

    @media (max-width: 600px) {
      header {
        padding: 0 14px;
      }

      #messages {
        padding: 20px 14px;
      }

      .composer {
        padding: 10px;
      }

      #sendButton {
        width: 65px;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="title">chat</div>
    <div class="group-code" id="groupCodeDisplay"></div>
  </header>

  <main id="messages"></main>

  <div class="composer">
    <input
      id="messageInput"
      type="text"
      maxlength="2000"
      placeholder="message..."
      autocomplete="off"
    >

    <button id="sendButton">send</button>
  </div>


  <div class="error-screen" id="errorScreen">
    <strong id="errorTitle">Something went wrong.</strong>
    <div id="errorText"></div>
    <a href="index.html" class="back">back</a>
  </div>


  <script>
    const messagesElement = document.getElementById("messages");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");

    const groupCodeDisplay =
      document.getElementById("groupCodeDisplay");

    const errorScreen =
      document.getElementById("errorScreen");

    const errorTitle =
      document.getElementById("errorTitle");

    const errorText =
      document.getElementById("errorText");


    /*
      Get group code from URL
    */

    const params = new URLSearchParams(window.location.search);
    const groupCode = params.get("group");

    const nickname =
      (localStorage.getItem("nickname") || "").trim();


    /*
      Basic validation
    */

    if (!groupCode || !nickname) {
      showError(
        "Missing information",
        "You need a group code and nickname."
      );
    } else {
      groupCodeDisplay.textContent =
        groupCode.substring(0, 12) + "...";

      startChat();
    }


    /*
      Show error
    */

    function showError(title, text) {
      document.querySelector("header").style.display = "none";
      messagesElement.style.display = "none";
      document.querySelector(".composer").style.display = "none";

      errorTitle.textContent = title;
      errorText.textContent = text;

      errorScreen.style.display = "flex";
    }


    /*
      Start chat
    */

    async function startChat() {

      // Make sure group exists
      const { data: group, error: groupError } =
        await supabaseClient
          .from("groups")
          .select("code")
          .eq("code", groupCode)
          .maybeSingle();


      if (groupError) {
        console.error(groupError);

        showError(
          "Connection error",
          "We couldn't connect to the chat server."
        );

        return;
      }


      if (!group) {
        showError(
          "Group not found",
          "That group doesn't exist."
        );

        return;
      }


      // Load old messages
      await loadMessages();


      // Connect realtime
      subscribeToMessages();


      messageInput.focus();
    }


    /*
      Load existing messages
    */

    async function loadMessages() {

      const { data, error } =
        await supabaseClient
          .from("messages")
          .select("*")
          .eq("group_code", groupCode)
          .order("created_at", {
            ascending: true
          })
          .limit(500);


      if (error) {
        console.error(error);

        showError(
          "Couldn't load messages",
          "Please refresh the page and try again."
        );

        return;
      }


      messagesElement.innerHTML = "";


      for (const message of data) {
        addMessage(message);
      }


      scrollToBottom();
    }


    /*
      Display a message
    */

    function addMessage(message) {

      const wrapper =
        document.createElement("div");

      wrapper.className = "message";


      if (message.nickname === nickname) {
        wrapper.classList.add("mine");
      }


      const name =
        document.createElement("div");

      name.className = "nickname";
      name.textContent = message.nickname;


      const content =
        document.createElement("div");

      content.className = "content";

      // textContent prevents HTML injection
      content.textContent = message.content;


      wrapper.appendChild(name);
      wrapper.appendChild(content);

      messagesElement.appendChild(wrapper);


      scrollToBottom();
    }


    /*
      Realtime messages
    */

    function subscribeToMessages() {

      supabaseClient
        .channel("group-" + groupCode)

        .on(
          "postgres_changes",
          {
            event: "INSERT",
            schema: "public",
            table: "messages",
            filter: "group_code=eq." + groupCode
          },
          (payload) => {

            addMessage(payload.new);

          }
        )

        .subscribe((status) => {

          console.log(
            "Realtime status:",
            status
          );

        });
    }


    /*
      Send message
    */

    async function sendMessage() {

      const content =
        messageInput.value.trim();


      if (!content) {
        return;
      }


      sendButton.disabled = true;


      const { error } =
        await supabaseClient
          .from("messages")
          .insert({
            group_code: groupCode,
            nickname: nickname,
            content: content
          });


      if (error) {
        console.error(error);

        alert(
          "Couldn't send your message. Please try again."
        );

        sendButton.disabled = false;

        return;
      }


      messageInput.value = "";

      sendButton.disabled = false;

      messageInput.focus();
    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {
          event.preventDefault();

          sendMessage();
        }

      }
    );


    /*
      Scroll to newest message
    */

    function scrollToBottom() {

      messagesElement.scrollTop =
        messagesElement.scrollHeight;
    }


    /*
      Click group code to copy it
    */

    groupCodeDisplay.addEventListener(
      "click",
      async () => {

        try {

          await navigator.clipboard.writeText(
            groupCode
          );

          const original =
            groupCodeDisplay.textContent;

          groupCodeDisplay.textContent =
            "copied!";

          setTimeout(() => {
            groupCodeDisplay.textContent =
              original;
          }, 1000);

        } catch (error) {
          console.error(error);
        }

      }
    );
  </script>

</body>
</html>
