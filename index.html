<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chat</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 24px;
      text-align: center;
    }

    h1 {
      font-size: 18px;
      font-weight: 400;
      color: #888;
      margin: 0 0 50px;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    button {
      width: 100%;
      padding: 18px;
      border: 1px solid #222;
      border-radius: 8px;
      background: #050505;
      color: #fff;
      font-size: 17px;
      cursor: pointer;
      transition: 0.15s;
    }

    button:hover {
      background: #111;
      border-color: #444;
    }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: rgba(0, 0, 0, 0.88);
    }

    .modal.active {
      display: flex;
    }

    .box {
      width: 100%;
      max-width: 380px;
      padding: 28px;
      border: 1px solid #222;
      border-radius: 10px;
      background: #050505;
    }

    .box h2 {
      margin: 0 0 8px;
      font-size: 20px;
      font-weight: 500;
    }

    .box p {
      margin: 0 0 24px;
      color: #777;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #222;
      border-radius: 7px;
      outline: none;
      background: #000;
      color: #fff;
      font-size: 15px;
    }

    input:focus {
      border-color: #555;
    }

    .submit {
      margin-top: 4px;
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    .submit:hover {
      background: #ddd;
      border-color: #ddd;
    }

    .submit:disabled {
      opacity: 0.5;
      cursor: wait;
    }

    .cancel {
      margin-top: 8px;
      border: none;
      background: transparent;
      color: #666;
      font-size: 14px;
    }

    .cancel:hover {
      background: transparent;
      color: #aaa;
      border: none;
    }

    .error {
      display: none;
      margin-top: 12px;
      color: #ff5555;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <main class="container">
    <h1>chat</h1>

    <div class="buttons">
      <button id="joinButton">join a group</button>
      <button id="createButton">create</button>
    </div>
  </main>


  <!-- CREATE -->
  <div class="modal" id="createModal">
    <div class="box">
      <h2>create a group</h2>
      <p>Choose the nickname you'll use in the group.</p>

      <input
        id="createNickname"
        type="text"
        placeholder="nickname"
        maxlength="24"
        autocomplete="off"
      >

      <button class="submit" id="createSubmit">
        create group
      </button>

      <button class="cancel" id="createCancel">
        cancel
      </button>

      <div class="error" id="createError"></div>
    </div>
  </div>


  <!-- JOIN -->
  <div class="modal" id="joinModal">
    <div class="box">
      <h2>join a group</h2>
      <p>Enter the group code and choose a nickname.</p>

      <input
        id="groupCode"
        type="text"
        placeholder="group code"
        maxlength="100"
        autocomplete="off"
      >

      <input
        id="joinNickname"
        type="text"
        placeholder="nickname"
        maxlength="24"
        autocomplete="off"
      >

      <button class="submit" id="joinSubmit">
        join group
      </button>

      <button class="cancel" id="joinCancel">
        cancel
      </button>

      <div class="error" id="joinError"></div>
    </div>
  </div>


  <script>
    const createButton = document.getElementById("createButton");
    const joinButton = document.getElementById("joinButton");

    const createModal = document.getElementById("createModal");
    const joinModal = document.getElementById("joinModal");

    const createCancel = document.getElementById("createCancel");
    const joinCancel = document.getElementById("joinCancel");

    const createSubmit = document.getElementById("createSubmit");
    const joinSubmit = document.getElementById("joinSubmit");

    const createNickname = document.getElementById("createNickname");
    const joinNickname = document.getElementById("joinNickname");
    const groupCode = document.getElementById("groupCode");

    const createError = document.getElementById("createError");
    const joinError = document.getElementById("joinError");


    function generateGroupCode() {
      const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789";

      const values = new Uint32Array(32);
      crypto.getRandomValues(values);

      let code = "";

      for (let i = 0; i < values.length; i++) {
        code += characters[values[i] % characters.length];
      }

      return code;
    }


    function showError(element, message) {
      element.textContent = message;
      element.style.display = "block";
    }


    function hideError(element) {
      element.style.display = "none";
    }


    createButton.addEventListener("click", () => {
      createModal.classList.add("active");
      createNickname.focus();
    });


    joinButton.addEventListener("click", () => {
      joinModal.classList.add("active");
      groupCode.focus();
    });


    createCancel.addEventListener("click", () => {
      createModal.classList.remove("active");
      hideError(createError);
    });


    joinCancel.addEventListener("click", () => {
      joinModal.classList.remove("active");
      hideError(joinError);
    });


    /*
      CREATE GROUP
    */
    createSubmit.addEventListener("click", async () => {
      const nickname = createNickname.value.trim();

      hideError(createError);

      if (!nickname) {
        showError(createError, "Please enter a nickname.");
        createNickname.focus();
        return;
      }

      createSubmit.disabled = true;
      createSubmit.textContent = "creating...";

      try {
        const code = generateGroupCode();

        const { error } = await supabaseClient
          .from("groups")
          .insert({
            code: code
          });

        if (error) {
          console.error(error);
          throw new Error("Could not create the group.");
        }

        localStorage.setItem("nickname", nickname);

        window.location.href =
          "groupchat.html?group=" +
          encodeURIComponent(code);

      } catch (error) {
        showError(createError, error.message);
        createSubmit.disabled = false;
        createSubmit.textContent = "create group";
      }
    });


    /*
      JOIN GROUP
    */
    joinSubmit.addEventListener("click", async () => {
      const code = groupCode.value.trim();
      const nickname = joinNickname.value.trim();

      hideError(joinError);

      if (!code) {
        showError(joinError, "Please enter a group code.");
        groupCode.focus();
        return;
      }

      if (!nickname) {
        showError(joinError, "Please enter a nickname.");
        joinNickname.focus();
        return;
      }

      joinSubmit.disabled = true;
      joinSubmit.textContent = "checking...";

      try {
        const { data, error } = await supabaseClient
          .from("groups")
          .select("code")
          .eq("code", code)
          .maybeSingle();

        if (error) {
          console.error(error);
          throw new Error("Could not check the group.");
        }

        if (!data) {
          throw new Error("That group doesn't exist.");
        }

        localStorage.setItem("nickname", nickname);

        window.location.href =
          "groupchat.html?group=" +
          encodeURIComponent(code);

      } catch (error) {
        showError(joinError, error.message);
        joinSubmit.disabled = false;
        joinSubmit.textContent = "join group";
      }
    });


    createNickname.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        createSubmit.click();
      }
    });


    groupCode.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        joinNickname.focus();
      }
    });


    joinNickname.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        joinSubmit.click();
      }
    });
  </script>

</body>
</html>
